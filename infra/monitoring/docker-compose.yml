services:
  prometheus:
    image: prom/prometheus:v3.1.0
    volumes:
      - ./prometheus.yml:/etc/prometheus/prometheus.yml:ro
    network_mode: host  # 컨테이너에서 localhost:8081(웹 서비스)을 그대로 스크레이핑하기 위함
    restart: unless-stopped

  grafana:
    image: grafana/grafana:11.4.0
    network_mode: host  # Prometheus와 동일한 이유. 3000번 포트도 SSH 터널로만 접근(공개 안 함)
    environment:
      - GF_SERVER_HTTP_PORT=3001  # 8081과 안 겹치게, Prometheus(9090)와도 안 겹치게
    volumes:
      - grafana-data:/var/lib/grafana
    restart: unless-stopped

volumes:
  grafana-data:
