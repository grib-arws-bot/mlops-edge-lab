<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>{% block title %}MLOps-Edge-Lab{% endblock %}</title>
<link rel="icon" type="image/svg+xml" href="/static/favicon.svg">
<style>
  :root {
    --bg: #0f1115; --panel: #171a21; --border: #2a2f3a; --text: #e6e8ec; --muted: #8b93a3;
    --accent: #4f8cff; --rule: #3fb950; --llm: #d29922; --danger: #f85149; --caution: #d29922; --normal: #3fb950;
  }
  * { box-sizing: border-box; }
  body { margin: 0; background: var(--bg); color: var(--text); font-family: -apple-system, "Segoe UI", "Noto Sans KR", sans-serif; line-height: 1.55; }
  header { padding: 14px 24px; border-bottom: 1px solid var(--border); display: flex; align-items: center; gap: 24px; }
  header .logo { color: var(--text); text-decoration: none; font-weight: 800; font-size: 1.15rem; letter-spacing: -0.02em; display: flex; align-items: center; gap: 8px; padding-right: 20px; border-right: 1px solid var(--border); }
  header .logo::before { content: "⬡"; color: var(--accent); font-size: 1.1rem; }
  header nav { display: flex; align-items: center; gap: 0; }
  header nav a { color: var(--muted); text-decoration: none; font-weight: 500; font-size: 0.92rem; white-space: nowrap; padding: 4px 16px; }
  header nav a:not(:first-child) { border-left: 1px solid var(--border); }
  header nav a:hover { color: var(--accent); }
  main { width: 100%; margin: 0; padding: 24px 32px; }
  h1 { font-size: 1.5rem; }
  h2 { font-size: 1.1rem; color: var(--muted); font-weight: 500; margin-top: 0; }
  .card { background: var(--panel); border: 1px solid var(--border); border-radius: 10px; padding: 18px 20px; margin-bottom: 16px; }
  .stage-no { display: inline-block; width: 28px; height: 28px; border-radius: 50%; background: var(--accent); color: #fff; text-align: center; line-height: 28px; font-size: 0.85rem; margin-right: 8px; }
  .stat { color: var(--muted); font-size: 0.9rem; margin: 2px 0; }
  .why { margin: 8px 0 4px; font-size: 0.92rem; }
  label { display: block; margin: 12px 0 4px; font-size: 0.9rem; color: var(--muted); }
  input, select { width: 100%; padding: 8px 10px; background: #0c0e12; border: 1px solid var(--border); border-radius: 6px; color: var(--text); font-size: 0.95rem; }
  button { margin-top: 18px; padding: 10px 20px; background: var(--accent); border: none; border-radius: 6px; color: #fff; font-weight: 600; cursor: pointer; }
  button:hover { opacity: 0.9; }
  .tag { display: inline-block; padding: 2px 8px; border-radius: 4px; font-size: 0.78rem; font-weight: 700; margin-right: 6px; }
  .tag.rule { background: rgba(63,185,80,0.15); color: var(--rule); border: 1px solid var(--rule); }
  .tag.llm { background: rgba(210,153,34,0.15); color: var(--llm); border: 1px solid var(--llm); }
  .severity { font-weight: 700; }
  .severity.정상 { color: var(--normal); }
  .severity.주의 { color: var(--caution); }
  .severity.위험 { color: var(--danger); }
  .decision-row { padding: 6px 0; border-bottom: 1px dashed var(--border); font-size: 0.88rem; }
  .decision-row:last-child { border-bottom: none; }
  code { background: #0c0e12; padding: 1px 5px; border-radius: 4px; font-size: 0.85em; }

  .flow { display: flex; align-items: stretch; width: 100%; padding-bottom: 10px; margin-bottom: 4px; }
  .stage-box { flex: 1 1 0; min-width: 0; background: var(--panel); border: 1px solid var(--border); border-radius: 10px; padding: 16px 18px; display: flex; flex-direction: column; }
  .arrow { flex: 0 0 34px; display: flex; align-items: center; justify-content: center; color: var(--muted); font-size: 1.5rem; }
  .stage-field { margin: 6px 0; font-size: 0.85rem; }
  .stage-field .k { color: var(--muted); display: block; font-size: 0.72rem; text-transform: uppercase; letter-spacing: 0.04em; margin-bottom: 1px; }
  .loop-badge { margin-top: 10px; padding: 6px 8px; border: 1px dashed var(--llm); border-radius: 6px; font-size: 0.76rem; color: var(--llm); }
  .feedback-loop { border: 1px dashed var(--muted); border-radius: 8px; padding: 10px 14px; margin: 4px 0 20px; font-size: 0.85rem; color: var(--muted); }
  .mlflow-hint { margin-top: 8px; font-size: 0.75rem; color: var(--muted); }
  .mlflow-hint code { font-size: 0.9em; }

  .page-header { display: flex; align-items: flex-start; justify-content: space-between; gap: 20px; margin-bottom: 18px; flex-wrap: wrap; }
  .page-header select { width: auto; min-width: 220px; }

  .sim-layout { display: grid; grid-template-columns: 420px 1fr; gap: 20px; align-items: start; }
  #sensor-cards { display: flex; flex-direction: column; gap: 8px; }
  .sensor-card.compact { padding: 10px 14px; margin-bottom: 0; }
  .sensor-card.compact .row1 { display: flex; align-items: center; gap: 8px; }
  .sensor-card.compact .chk { display: flex; align-items: center; margin: 0; width: auto; }
  .sensor-card.compact .chk input { width: auto; }
  .sensor-card.compact .sensor-label { font-weight: 600; font-size: 0.85rem; flex: 0 0 48px; }
  .sensor-card.compact select { width: auto; flex: 1 1 0; min-width: 0; padding: 6px 8px; font-size: 0.86rem; }

  .severity-buttons { display: flex; gap: 6px; margin-top: 8px; }
  .severity-buttons input[type="radio"] { display: none; }
  .severity-buttons label { flex: 1; text-align: center; padding: 6px 4px; border: 1px solid var(--border); border-radius: 6px; font-size: 0.82rem; cursor: pointer; color: var(--muted); }
  .severity-buttons input:checked + label.sev-정상 { background: rgba(63,185,80,0.15); border-color: var(--normal); color: var(--normal); }
  .severity-buttons input:checked + label.sev-주의 { background: rgba(210,153,34,0.15); border-color: var(--caution); color: var(--caution); }
  .severity-buttons input:checked + label.sev-심각 { background: rgba(248,81,73,0.15); border-color: var(--danger); color: var(--danger); }

  .stopwatch { display: none; margin: 4px 0 18px; padding: 10px 14px; border: 1px dashed var(--llm); border-radius: 8px; color: var(--llm); font-size: 0.9rem; background: rgba(210,153,34,0.08); }

  .feedback-area button { margin-top: 0; padding: 5px 12px; font-size: 0.8rem; background: transparent; border: 1px solid var(--border); color: var(--muted); }
  .feedback-area button:hover { border-color: var(--accent); color: var(--accent); opacity: 1; }
  .correction-box { width: 100%; min-height: 56px; padding: 8px 10px; background: #0c0e12; border: 1px solid var(--border); border-radius: 6px; color: var(--text); font-family: inherit; font-size: 0.88rem; margin-top: 6px; }

  .equipment-grid { display: grid; grid-template-columns: repeat(auto-fit, minmax(160px, 1fr)); gap: 10px; margin-top: 10px; }
  .equip-item { display: flex; align-items: center; gap: 8px; padding: 10px 12px; border-radius: 8px; border: 1px solid var(--border); font-size: 0.88rem; }
  .equip-dot { width: 10px; height: 10px; border-radius: 50%; background: var(--muted); flex: 0 0 auto; }
  .equip-item.equip-실행됨 .equip-dot { background: var(--rule); }
  .equip-item.equip-대기 .equip-dot { background: var(--llm); }
  .equip-item.equip-꺼짐 .equip-dot { background: #444a56; }
  .equip-status { margin-left: auto; color: var(--muted); font-size: 0.78rem; }

  .sensor-result { padding: 12px 0; border-bottom: 1px solid var(--border); font-size: 0.92rem; }
  .sensor-result:last-child { border-bottom: none; }
  details { margin-top: 6px; }
  summary { cursor: pointer; color: var(--accent); font-size: 0.82rem; }

  @media (max-width: 900px) {
    .sim-layout { grid-template-columns: 1fr; }
  }

  .site-grid { display: grid; grid-template-columns: repeat(auto-fit, minmax(280px, 1fr)); gap: 16px; }
  .site-card { background: var(--panel); border: 1px solid var(--border); border-radius: 10px; padding: 14px 16px; }
  .site-name { font-weight: 700; margin-bottom: 8px; font-size: 0.92rem; }
  .sensor-row { display: flex; align-items: center; justify-content: space-between; gap: 8px; padding: 5px 0; border-bottom: 1px dashed var(--border); font-size: 0.85rem; }
  .sensor-row:last-child { border-bottom: none; }
  .sensor-name { font-weight: 600; flex: 0 0 auto; }
  .sensor-row .stat { margin: 0; flex: 1 1 auto; text-align: right; }
  .sensor-row .severity { flex: 0 0 auto; font-size: 0.82rem; margin-left: 8px; }
  .site-alert { margin-top: 10px; padding: 8px 10px; border-radius: 8px; border: 1px dashed var(--border); font-size: 0.85rem; }
  .site-alert.alert-주의 { border-color: var(--caution); background: rgba(210,153,34,0.08); }
  .site-alert.alert-위험 { border-color: var(--danger); background: rgba(248,81,73,0.08); }
  .feed-head { display: flex; align-items: center; gap: 6px; margin-bottom: 4px; flex-wrap: wrap; }
  .feed-narrative { color: var(--text); line-height: 1.4; }
</style>
</head>
<body>
<header>
  <a class="logo" href="/">MLOps-Edge-Lab</a>
  <nav>
    <a href="/education">교육 자료</a>
    <a href="/">MLOps 파이프라인</a>
    <a href="/simulate">엣지 시뮬레이션</a>
    <a href="/control-room">산업안전 통합관제</a>
  </nav>
  <span class="muted" style="margin-left:auto; color: var(--muted); font-size:0.85rem;">현장 안전 오프라인 어시스턴트 · 교육용 데모</span>
</header>
<main>
{% block content %}{% endblock %}
</main>
</body>
</html>
