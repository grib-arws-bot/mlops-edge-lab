{% extends "base.html" %}
{% block title %}교육 자료 | MLOps-Edge-Lab{% endblock %}
{% block content %}
{% if deck_available %}
<style>
  #deck-viewer {
    position: relative; width: 100%; background: #0a0a0a; border-radius: 10px;
    overflow: hidden; display: flex; align-items: center; justify-content: center;
    height: calc(100vh - 140px);
  }
  #deck-viewer:fullscreen { height: 100vh; border-radius: 0; }
  #deck-slide-img { max-width: 100%; max-height: 100%; display: block; user-select: none; cursor: pointer; }
  #deck-hud {
    position: absolute; bottom: 10px; left: 50%; transform: translateX(-50%);
    background: rgba(0,0,0,0.55); color: #fff; padding: 5px 14px; border-radius: 20px;
    font-size: 0.82rem; display: flex; align-items: center; gap: 12px; pointer-events: none;
  }
  #deck-toolbar {
    display: flex; align-items: center; justify-content: space-between; gap: 10px;
    margin-bottom: 8px;
  }
  #deck-toolbar button {
    margin-top: 0; padding: 6px 14px; font-size: 0.85rem;
  }
  .deck-nav-btn { background: transparent; border: 1px solid var(--border); color: var(--muted); }
  .deck-nav-btn:hover { border-color: var(--accent); color: var(--accent); }
</style>

<div id="deck-toolbar">
  <div style="display:flex; gap:6px;">
    <button type="button" id="deck-prev-btn" class="deck-nav-btn">◀ 이전</button>
    <button type="button" id="deck-next-btn" class="deck-nav-btn">다음 ▶</button>
  </div>
  <button type="button" id="deck-fullscreen-btn">⛶ 전체화면으로 보기</button>
</div>

<div id="deck-viewer">
  <div class="stat" style="color:#888;">불러오는 중...</div>
</div>

<script>
const DECK_PAGE_COUNT = {{ page_count }};
let deckPage = 1;

function deckImgUrl(n) {
  return '/assets/deck_pages/page_' + String(n).padStart(3, '0') + '.png';
}

function renderDeckPage() {
  const viewer = document.getElementById('deck-viewer');
  viewer.innerHTML =
    '<img id="deck-slide-img" src="' + deckImgUrl(deckPage) + '" alt="슬라이드 ' + deckPage + '" title="클릭하면 다음 슬라이드">' +
    '<div id="deck-hud">' + deckPage + ' / ' + DECK_PAGE_COUNT + '</div>';
  // 컨테이너 좌/우 반으로 나눠 클릭을 판정했더니, 세로로 긴 화면에서는 이미지가
  // 레터박스(양옆 여백)되면서 실제 이미지 경계와 클릭 판정 경계가 어긋나 "이상하게"
  // 동작했다(사용자 지적, 2026-09-21). 좌우 구분을 없애고 "클릭하면 항상 다음"으로
  // 단순화 — 되돌아가는 건 휠/키보드/버튼으로 충분하다.
  document.getElementById('deck-slide-img').addEventListener('click', () => gotoDeckPage(deckPage + 1));
  // 다음 장을 미리 받아둬서 넘길 때 깜빡이지 않게 한다.
  if (deckPage < DECK_PAGE_COUNT) {
    const preload = new Image();
    preload.src = deckImgUrl(deckPage + 1);
  }
}

function gotoDeckPage(n) {
  if (n < 1 || n > DECK_PAGE_COUNT) return;
  deckPage = n;
  renderDeckPage();
}

document.getElementById('deck-prev-btn').addEventListener('click', () => gotoDeckPage(deckPage - 1));
document.getElementById('deck-next-btn').addEventListener('click', () => gotoDeckPage(deckPage + 1));

// 방향키·Page Up/Down으로 이동 — 실제 파워포인트 프레젠테이션 조작과 동일하게
// (사용자 요청, 2026-09-21). 입력창에 포커스가 있을 때는 건드리지 않는다.
document.addEventListener('keydown', (e) => {
  const tag = (document.activeElement && document.activeElement.tagName) || '';
  if (tag === 'INPUT' || tag === 'TEXTAREA') return;
  if (e.key === 'ArrowRight' || e.key === 'ArrowDown' || e.key === ' ' || e.key === 'PageDown') { gotoDeckPage(deckPage + 1); e.preventDefault(); }
  if (e.key === 'ArrowLeft' || e.key === 'ArrowUp' || e.key === 'PageUp') { gotoDeckPage(deckPage - 1); e.preventDefault(); }
});

// 마우스 휠로도 이동(사용자 요청) — 트랙패드 등에서 휠 이벤트가 한 번의 스크롤
// 동작에도 여러 번 잘게 발생해서, 짧은 쿨다운을 둬서 한 번에 여러 장 넘어가는 걸
// 막는다.
let deckWheelCooldown = false;
document.getElementById('deck-viewer').addEventListener('wheel', (e) => {
  e.preventDefault();
  if (deckWheelCooldown) return;
  deckWheelCooldown = true;
  setTimeout(() => { deckWheelCooldown = false; }, 350);
  if (e.deltaY > 0) gotoDeckPage(deckPage + 1);
  else if (e.deltaY < 0) gotoDeckPage(deckPage - 1);
}, { passive: false });

function requestFullscreenOn(el) {
  const fn = el.requestFullscreen || el.webkitRequestFullscreen;
  if (fn) fn.call(el);
}
document.getElementById('deck-fullscreen-btn').addEventListener('click', () => {
  requestFullscreenOn(document.getElementById('deck-viewer'));
});

renderDeckPage();
</script>
{% else %}
<div class="card">교육 자료가 아직 준비되지 않았습니다. <code>docs/교육자료/MLOps-Edge-Lab_교육자료.pptx</code>를 확인해 주세요.</div>
{% endif %}
{% endblock %}
