{% extends "base.html" %}
{% block title %}산업안전 통합관제 | MLOps-Edge-Lab{% endblock %}
{% block content %}
<div class="page-header">
  <div>
    <h1>산업안전 통합관제 (시연)</h1>
    <h2 style="margin-bottom:0;">각 현장의 여러 센서를 12초마다 실제 파이프라인(preview·Agent)으로 재계산합니다 — 정상으로 돌아오면 알림은 사라집니다</h2>
  </div>
  <div style="display:flex; align-items:center; gap:14px;">
    <label style="display:flex; align-items:center; gap:6px; margin:0; color:var(--muted); font-size:0.85rem; white-space:nowrap;">
      <input type="checkbox" id="tts_enabled" style="width:auto;"> 새 알림 음성 방송(3회)
    </label>
    <select id="edge_profile">
      {% for key, p in edge_profiles.items() %}
      <option value="{{ key }}">{{ p.label }}</option>
      {% endfor %}
    </select>
  </div>
</div>

<div id="site-grid" class="site-grid">
  {% for site in sites %}
  <div class="site-card" data-site="{{ site }}">
    <div class="site-name">{{ site }}</div>
    <div class="sensor-rows"><div class="stat">로딩 중...</div></div>
    <div class="site-alert" style="display:none;"></div>
  </div>
  {% endfor %}
</div>

<script>
function escapeHtml(s) {
  return (s || "").replace(/[&<>"']/g, c => ({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#39;"}[c]));
}

// 장비 조치의 "at"은 ISO 전체 문자열("2026-09-17T23:49:47")이라, 센서/LLM 시각과
// 형식을 맞추려고 시:분:초 부분만 뽑는다.
function isoTime(s) {
  if (!s) return '-';
  const idx = s.indexOf('T');
  return idx === -1 ? s : s.slice(idx + 1);
}

let userChangedProfile = false;
// 사이트별로 "이미 방송한 알림"을 logged_at 기준으로 기억해서, 5초 폴링마다 같은
// 알림을 계속 다시 읽지 않게 한다(값이 바뀌어 새 알림이 뜰 때만 새로 방송).
const announcedAt = {};

function announceAlert(site, narrative) {
  if (!window.speechSynthesis) return;
  const text = site + ' 알림. ' + narrative;
  for (let i = 0; i < 3; i++) {
    const utter = new SpeechSynthesisUtterance(text);
    utter.lang = 'ko-KR';
    window.speechSynthesis.speak(utter);
  }
}

async function refreshControlRoom() {
  let data;
  try {
    const res = await fetch('/api/control-room/status');
    data = await res.json();
  } catch (e) {
    return;
  }

  // 서버가 알고 있는 현재 프로파일로 셀렉트를 맞춰준다(다른 사람이 바꿨을 수도 있으므로) —
  // 단, 지금 사용자가 막 고른 직후라면(폴링 타이밍 겹침) 덮어쓰지 않는다.
  const select = document.getElementById('edge_profile');
  if (!userChangedProfile && data.edge_profile && select.value !== data.edge_profile) {
    select.value = data.edge_profile;
  }

  for (const s of (data.sites || [])) {
    const card = document.querySelector('.site-card[data-site="' + CSS.escape(s.name) + '"]');
    if (!card) continue;

    const sensors = s.sensors || {};
    const rows = Object.entries(sensors).map(([name, d]) =>
      '<div class="sensor-row">' +
        '<span class="sensor-name">' + escapeHtml(name) + '</span>' +
        '<span class="stat">' + d.value + d.unit + ' (임계 ' + d.threshold + d.unit + ')</span>' +
        '<span class="severity ' + d.severity + '">' + d.severity + '</span>' +
      '</div>'
    ).join('');
    card.querySelector('.sensor-rows').innerHTML = rows || '<div class="stat">센서 없음</div>';

    const alertBox = card.querySelector('.site-alert');
    if (s.alert) {
      const eq = s.alert.equipment || [];
      const equipHtml = eq.length
        ? '<div class="equipment-grid" style="margin: 6px 0;">' + eq.map(e =>
            '<div class="equip-item equip-' + e.status + '"><span class="equip-dot"></span>' + escapeHtml(e.equipment) + '<span class="equip-status">' + escapeHtml(e.status) + '</span></div>'
          ).join('') + '</div>'
        : '';
      // 단계별 타임스탬프(사용자 요청) — 센서 변경 → 장비 동작 → LLM 안내 완성 순서로.
      const equipTime = eq.length ? isoTime(eq[0].at) : s.alert.sensor_changed_at;
      const timelineHtml =
        '<div class="stat" style="margin: 4px 0 0;">⏱ ' +
        (s.alert.sensor_changed_at || '-') + ' 감지 → ' +
        equipTime + ' 장비 동작 → ' +
        s.alert.logged_at + ' 안내 완성 (+' + (s.alert.elapsed ?? '?') + 's, ' + escapeHtml(s.alert.edge_label || '') + ')' +
        '</div>';
      alertBox.className = 'site-alert alert-' + s.alert.severity;
      alertBox.innerHTML =
        '<div class="feed-head"><span class="severity ' + s.alert.severity + '">' + s.alert.severity + '</span></div>' +
        equipHtml +
        '<div class="feed-narrative">' + escapeHtml(s.alert.narrative) + '</div>' +
        timelineHtml;
      alertBox.style.display = 'block';

      if (document.getElementById('tts_enabled').checked && announcedAt[s.name] !== s.alert.logged_at) {
        announceAlert(s.name, s.alert.narrative);
      }
      announcedAt[s.name] = s.alert.logged_at;
    } else {
      alertBox.style.display = 'none';
      alertBox.innerHTML = '';
      delete announcedAt[s.name];
    }
  }
}

refreshControlRoom();
setInterval(refreshControlRoom, 5000);

document.getElementById('edge_profile').addEventListener('change', async (e) => {
  userChangedProfile = true;
  try {
    await fetch('/api/control-room/edge-profile', {
      method: 'POST', headers: {'Content-Type': 'application/json'},
      body: JSON.stringify({edge_profile: e.target.value}),
    });
  } catch (err) {
    // 네트워크 오류는 다음 폴링 때 서버 상태로 다시 맞춰짐
  }
  setTimeout(() => { userChangedProfile = false; }, 8000);
});
</script>
{% endblock %}
